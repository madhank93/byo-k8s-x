  - slug: foreign-children
    name: Leave other people's objects alone
    difficulty: medium
  - slug: events
    name: Record events
    difficulty: medium
  - slug: metrics
    name: Expose the loop's metrics
    difficulty: easy
  - slug: health-probes
    name: Answer healthz and readyz
    difficulty: easy
