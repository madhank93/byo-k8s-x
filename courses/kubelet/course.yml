slug: kubelet
name: Build your own kubelet
language: go
entrypoint: main.go
# The program runs inside the first worker node, beside that node's own
# kubelet, as the kubelet for a Node of its own; see internal/stages/kubelet.
workers: 1
stages:
  - slug: node-register
    name: Register a node
    difficulty: easy
  - slug: node-status
    name: Report what the machine is
    difficulty: medium
  - slug: node-lease
    name: Hold the node's lease
    difficulty: medium
  - slug: run-container
    name: Run a pod's containers
    difficulty: hard
  - slug: pod-status
    name: Report the pod back
    difficulty: hard
  - slug: graceful-delete
    name: Stop a pod gracefully
    difficulty: medium
  - slug: restart-policy
    name: Restart what exits
    difficulty: medium
  - slug: init-containers
    name: Run init containers first
    difficulty: medium
  - slug: env
    name: Give containers their environment
    difficulty: medium
  - slug: volumes
    name: Mount emptyDir and hostPath volumes
    difficulty: medium
  - slug: config-volumes
    name: Project ConfigMaps and Secrets into files
    difficulty: medium
  - slug: service-account-token
    name: Mount the pod's service account token
    difficulty: medium
  - slug: resources
    name: Admit what fits, limit what runs
    difficulty: hard
  - slug: liveness-probe
    name: Restart what stops answering
    difficulty: hard
  - slug: readiness-probe
    name: Say when a container is ready
    difficulty: medium
  - slug: lifecycle-hooks
    name: Run lifecycle hooks
    difficulty: medium
  - slug: static-pod
    name: Run static pods from files
    difficulty: hard
  - slug: reconcile
    name: Pick up where it left off
    difficulty: medium
  - slug: eviction
    name: Evict what outgrows its limit
    difficulty: medium
  - slug: logs-api
    name: Serve kubectl logs
    difficulty: hard
