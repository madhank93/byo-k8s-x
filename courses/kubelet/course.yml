slug: kubelet
name: Build your own kubelet
language: go
entrypoint: main.go
# The program runs inside the first worker node, beside that node's own
# kubelet, as the kubelet for a Node of its own; see internal/stages/kubelet.
workers: 1
stages:
  - slug: node-register
    name: Register a node
    difficulty: easy
  - slug: node-status
    name: Report what the machine is
    difficulty: medium
  - slug: node-lease
    name: Hold the node's lease
    difficulty: medium
  - slug: run-container
    name: Run a pod's containers
    difficulty: hard
  - slug: pod-status
    name: Report the pod back
    difficulty: hard
  - slug: graceful-delete
    name: Stop a pod gracefully
    difficulty: medium
  - slug: restart-policy
    name: Restart what exits
    difficulty: medium
  - slug: init-containers
    name: Run init containers first
    difficulty: medium
  - slug: env
    name: Give containers their environment
    difficulty: medium
  - slug: volumes
    name: Mount emptyDir and hostPath volumes
    difficulty: medium
  - slug: config-volumes
    name: Project ConfigMaps and Secrets into files
    difficulty: medium
