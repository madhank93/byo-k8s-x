slug: apiserver
name: Build your own kube-apiserver
language: go
entrypoint: main.go
# No cluster: this course builds the thing the others are clients of, so its
# stages talk to the learner's own server over HTTP.
stages:
  - slug: serve
    name: Something that answers
    difficulty: easy
  - slug: discovery-root
    name: What this server can do
    difficulty: medium
  - slug: resource-create
    name: The first thing worth storing
    difficulty: medium
  - slug: resource-get
    name: Ask for it by name
    difficulty: easy
  - slug: list
    name: All of them, in order
    difficulty: medium
  - slug: update
    name: The write that can lose a race
    difficulty: medium
  - slug: delete
    name: Taking it back out
    difficulty: medium
