name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that needs no cluster. Fast, and the gate most pushes hit.
  static:
    name: vet, format, sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal web/gen)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go test ./internal/...
      # Every stage must show its own step. See hack/sweep.sh for why this
      # exists from the first stage rather than being added later.
      - run: ./hack/sweep.sh

  # The real thing: a kind cluster, and every reference stage graded against it
  # cumulatively. This is the check that would catch a stage whose assertions
  # drifted from its reference solution.
  course:
    name: verify reference stages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          cluster_name: byok8s
      - name: Verify every stage of every shipped course
        run: |
          for slug in $(go run ./cmd/byok8s courses --shipped); do
            count=$(grep -c '^  - slug: ' "courses/$slug/course.yml")
            echo "::group::$slug ($count stages)"
            ./hack/vsnap.sh "$slug" "$count"
            echo "::endgroup::"
          done
      - name: The snapshots must be unchanged by verification
        run: git diff --exit-code courses/*/reference/stages
