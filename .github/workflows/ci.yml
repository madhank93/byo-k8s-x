name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Everything that needs no cluster. Fast, and the gate most pushes hit.
  static:
    name: vet, format, sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal web/gen)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go test ./internal/...
      # Every stage must show its own step. See hack/sweep.sh for why this
      # exists from the first stage rather than being added later.
      - run: ./hack/sweep.sh

  # The real thing: a kind cluster, and every reference stage graded against it
  # cumulatively. This is the check that would catch a stage whose assertions
  # drifted from its reference solution.
  course:
    name: verify reference stages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: helm/kind-action@v1
        with:
          install_only: true
      # Sized by the courses themselves (course.yml `workers`), so CI creates
      # the cluster exactly the way a learner does.
      - run: go run ./cmd/byok8s up
      # The API server reaches a webhook running on the host by name, and
      # host.docker.internal is a Docker Desktop convenience that a Linux
      # runner does not provide. From inside a kind node the host is the kind
      # network's gateway, so the graders are told to use that instead.
      - name: Name the host in a way the cluster can resolve
        run: |
          # kind's network is dual-stack and the IPv6 entry can come first, so
          # the IPv4 gateway is picked by shape rather than by position: the
          # graders build "https://host:port/…", which a bare IPv6 literal
          # would need brackets for.
          gateway=$(docker network inspect kind --format '{{json .IPAM.Config}}' \
            | jq -r 'first(.[] | select(.Gateway != null and (.Gateway | contains(":") | not)) | .Gateway)')
          if [ -z "$gateway" ] || [ "$gateway" = "null" ]; then
            echo "::error::no IPv4 gateway on the kind network"; exit 1
          fi
          echo "resolved host address: $gateway"
          echo "BYOK8S_EXTERNAL_HOST=$gateway" >> "$GITHUB_ENV"
      - name: Verify every stage of every shipped course
        run: |
          for slug in $(go run ./cmd/byok8s courses --shipped); do
            count=$(grep -c '^  - slug: ' "courses/$slug/course.yml")
            echo "::group::$slug ($count stages)"
            ./hack/vsnap.sh "$slug" "$count"
            echo "::endgroup::"
          done
      - name: The snapshots must be unchanged by verification
        run: git diff --exit-code courses/*/reference/stages
